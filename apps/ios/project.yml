name: WordInk
options:
  bundleIdPrefix: com.wordink
  groupSortPosition: top
targets:
  WordInkRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WordInkRemote
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: WordInkWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordink.remote
        INFOPLIST_FILE: WordInkRemote/Info.plist
        CODE_SIGN_ENTITLEMENTS: WordInkRemote/WordInkRemote.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
  WordInkWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WordInkWidgets
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordink.remote.widgets
        INFOPLIST_FILE: WordInkWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: "NO"
  WordInkRemoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WordInkRemoteTests
    dependencies:
      - target: WordInkRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordink.remote.tests
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WordInkRemote.app/WordInkRemote
schemes:
  WordInkRemote:
    build:
      targets:
        WordInkRemote: all
        WordInkWidgets: [run, archive]
        WordInkRemoteTests: [test]
    test:
      targets:
        - WordInkRemoteTests
    run:
      config: Debug
    archive:
      config: Release
