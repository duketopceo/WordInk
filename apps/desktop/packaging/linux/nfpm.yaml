# The wordink .deb and .rpm, built by scripts/package-linux.sh with nfpm from a
# release executable, in a directory it stages with wordink, io.github.duketopceo.wordink.desktop,
# the hicolor icons, wordink.service, LICENSE, and the postinst/postrm scripts. They install what the AUR package wordink-bin does:
# /usr/bin/wordink, the desktop entry, and the systemd user unit. WordInk never
# replaces a package-managed executable; it shows the update command the
# release service lists for the deb-<arch> or rpm-<arch> distribution.
name: wordink
arch: ${HEX_PACKAGE_ARCH}
platform: linux
version: ${HEX_PACKAGE_VERSION}
version_schema: none
release: "1"
section: utils
priority: optional
maintainer: WordInk contributors
vendor: WordInk contributors
homepage: https://github.com/duketopceo/WordInk
license: MIT
description: |-
  WordInk voice dictation: hold a key, speak, and it types.
  Local speech recognition with optional voice commands (Linux beta).
contents:
  - src: wordink
    dst: /usr/bin/wordink
    file_info:
      mode: 0755
  - src: io.github.duketopceo.wordink.desktop
    dst: /usr/share/applications/io.github.duketopceo.wordink.desktop
    file_info:
      mode: 0644
  - src: icons/hicolor/16x16/apps/io.github.duketopceo.wordink.png
    dst: /usr/share/icons/hicolor/16x16/apps/io.github.duketopceo.wordink.png
    file_info:
      mode: 0644
  - src: icons/hicolor/24x24/apps/io.github.duketopceo.wordink.png
    dst: /usr/share/icons/hicolor/24x24/apps/io.github.duketopceo.wordink.png
    file_info:
      mode: 0644
  - src: icons/hicolor/32x32/apps/io.github.duketopceo.wordink.png
    dst: /usr/share/icons/hicolor/32x32/apps/io.github.duketopceo.wordink.png
    file_info:
      mode: 0644
  - src: icons/hicolor/48x48/apps/io.github.duketopceo.wordink.png
    dst: /usr/share/icons/hicolor/48x48/apps/io.github.duketopceo.wordink.png
    file_info:
      mode: 0644
  - src: icons/hicolor/64x64/apps/io.github.duketopceo.wordink.png
    dst: /usr/share/icons/hicolor/64x64/apps/io.github.duketopceo.wordink.png
    file_info:
      mode: 0644
  - src: icons/hicolor/128x128/apps/io.github.duketopceo.wordink.png
    dst: /usr/share/icons/hicolor/128x128/apps/io.github.duketopceo.wordink.png
    file_info:
      mode: 0644
  - src: icons/hicolor/256x256/apps/io.github.duketopceo.wordink.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.duketopceo.wordink.png
    file_info:
      mode: 0644
  - src: icons/hicolor/512x512/apps/io.github.duketopceo.wordink.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.duketopceo.wordink.png
    file_info:
      mode: 0644
  - src: icons/hicolor/scalable/apps/io.github.duketopceo.wordink.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.duketopceo.wordink.svg
    file_info:
      mode: 0644
  - src: wordink.service
    dst: /usr/lib/systemd/user/wordink.service
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/wordink/LICENSE
    file_info:
      mode: 0644
scripts:
  postinstall: refresh-desktop.sh
  postremove: refresh-desktop.sh
overrides:
  # Linked, then loaded at runtime: the X11, Wayland, and xkbcommon client
  # libraries. Ubuntu 24.04 renamed alsa for its 64-bit time_t
  # transition, so it takes either name.
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgcc-s1
      - libstdc++6
      - libasound2t64 | libasound2
      - libvulkan1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libxcb1
      - libxcursor1
      - libxi6
      - libwayland-client0
      - curl
    recommends:
      - mesa-vulkan-drivers
      - wl-clipboard
      - wtype
      - xdg-utils
  # Library names, so Fedora and openSUSE resolve them to their own packages.
  rpm:
    depends:
      - libasound.so.2()(64bit)
      - libvulkan.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libwayland-client.so.0()(64bit)
      - curl
    recommends:
      - wl-clipboard
      - wtype
      - xdg-utils
rpm:
  group: Applications/Productivity
  summary: WordInk voice dictation (based on Hex by Anomaly)
