<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e12" media="(prefers-color-scheme: dark)" />
    <title>WordInk: plain HTML</title>
    <!--
      No build step: one module script. From npm via a CDN this is
      <script type="module" src="https://cdn.jsdelivr.net/npm/@wordink/web/dist/wordink-web.cdn.js"></script>
      Here it loads the local build (run `pnpm build` first). The core wasm is fetched from beside the script.
    -->
    <link rel="stylesheet" href="../shared/wordink-demo.css" />
    <script type="module" src="../../packages/web/dist/wordink-web.cdn.js"></script>
  </head>
  <body>
    <main class="demo-shell">
      <h1>Dictate into a textarea</h1>
      <label for="message">Message</label>
      <textarea id="message" class="demo-field" rows="5" placeholder="Hold the mic and speak…"></textarea>
      <div class="demo-row">
        <!-- endpoint: your @wordink/server relay (it keeps the provider key off the page). -->
        <wordink-mic for="message" provider="groq" endpoint="/api/wordink" shortcut="Alt+D"></wordink-mic>
        <span class="demo-hint">Hold the button, or hold <kbd>Alt</kbd>+<kbd>D</kbd>, while you speak.</span>
      </div>
    </main>
  </body>
</html>
