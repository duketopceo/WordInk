version: 2
updates:
  # npm/pnpm workspace root (packages/*, apps/docs)
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-deps:
        patterns: ["*"]
  # Python SDK (uv)
  - package-ecosystem: uv
    directory: /sdks/python
    schedule: { interval: weekly }
    groups:
      python-deps:
        patterns: ["*"]
  # Rust workspace (crates/*)
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust-deps:
        patterns: ["*"]
  # Desktop app (its own workspace; git-sourced crates are skipped by Dependabot)
  - package-ecosystem: cargo
    directory: /apps/desktop
    schedule: { interval: weekly }
    groups:
      desktop-rust-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
