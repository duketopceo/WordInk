version: 2
updates:
  # npm/pnpm workspace root (packages/*, apps/docs)
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-deps:
        patterns: ["*"]
  # Python SDK (uv)
  - package-ecosystem: uv
    directory: /sdks/python
    schedule: { interval: weekly }
    groups:
      python-deps:
        patterns: ["*"]
  # Rust workspace (crates/*)
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust-deps:
        patterns: ["*"]
  # Desktop app; this directory arrives with the apps/desktop change.
  - package-ecosystem: cargo
    directory: /apps/desktop
    schedule: { interval: weekly }
    groups:
      desktop-rust-deps:
        patterns: ["*"]
  # Swift packages
  - package-ecosystem: swift
    directory: /sdks/ios
    schedule: { interval: weekly }
  - package-ecosystem: swift
    directory: /apps/ios/xtool
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
