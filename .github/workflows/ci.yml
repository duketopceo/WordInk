name: CI
on:
  push: { branches: [master] }
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p wordink-wasm --target wasm32-unknown-unknown --release
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - &wasm-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the exact wasm-bindgen version pinned in crates/wordink-wasm/Cargo.toml.
      - &wasm-bindgen
        uses: taiki-e/install-action@v2
        with: { tool: wasm-bindgen@0.2.129 }
      - &binaryen
        name: Install binaryen (wasm-opt)
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_130/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # Includes the core wasm gzip size check (KTD1, 150 KB).
      - run: pnpm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - *wasm-toolchain
      - uses: Swatinem/rust-cache@v2
      - *wasm-bindgen
      - *binaryen
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Both e2e suites read model files from $WORDINK_MODEL_CACHE (default ~/.cache/wordink-models)
      # and fetch a miss from huggingface.co — uncached runs rate-limit (429) mid-suite.
      - name: Cache the e2e model download
        uses: actions/cache@v4
        with:
          path: ~/.cache/wordink-models
          # moonshine.ts carries the pinned revision; a bump misses the key and re-downloads once.
          key: wordink-models-${{ hashFiles('packages/local/src/moonshine.ts') }}
      - run: pnpm --filter @wordink/core exec playwright install --with-deps chromium firefox webkit
      # Firefox's media graph needs an audio server: without one its fake microphone is silent and
      # every dictation ends in NoSpeech. A PulseAudio null sink gives it one.
      - name: Start a PulseAudio null sink
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink
      - run: pnpm test:e2e
  legacy:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: legacy }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install system audio deps (PyAudio build)
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run python -m compileall wordink
  ios:
    runs-on: macos-15
    defaults:
      run: { working-directory: apps/ios }
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen --spec project.yml
      - name: Build and test on iOS Simulator
        run: |
          SIM=$(xcrun simctl list devices available --json | python3 -c 'import json,sys,re; devs=json.load(sys.stdin)["devices"]; nums=lambda s: tuple(int(x) for x in re.findall(r"\d+", s)); pick=max((nums(rt), nums(d["name"]), d["name"]) for rt,ds in devs.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")); print(pick[2])')
          xcodebuild -scheme WordInkRemote -destination "platform=iOS Simulator,name=$SIM" CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES -derivedDataPath build test
