# Desktop release: a `desktop-v<version>` tag builds the app on the four
# platforms, signs the Linux executables and the checksum list, and publishes
# one GitHub Release with SHA256SUMS(.sig), an SBOM, build-provenance
# attestations and the update manifests (dev.json, plus stable.json on a final)
# the in-app updater reads.
# Tags are `desktop-vX.Y.Z` (final, channel stable, marked latest) and
# `desktop-vX.Y.Z-rc.N` (release candidate, channel dev, prerelease, never
# latest). See docs/releasing.md for the runbook.
#
# Job graph:
#   prepare -> gate -> build (x4), sbom -> package-linux -> sign-linux
#           -> draft -> [smoke: U9 inserts its jobs here] -> publish
#
# Trust boundaries:
#   prepare, gate   read-only; no secrets. gate only calls the GitHub API.
#   build           runs repository code (cargo, build.rs); no secrets, read-only.
#   package-linux   assembles the Linux tarballs from the build output; no
#                   secrets. It runs before signing so the signed SHA256SUMS
#                   covers the tarballs.
#   sign-linux      the only job that can read WORDINK_LINUX_SIGNING_KEY. It
#                   sits in the protected `release` environment, so the owner
#                   approves it. Only its two `sign-linux.sh` steps hold the
#                   key; everything built is treated as data and never run.
#   draft           uploads the assets as a DRAFT release; holds no signing key.
#   publish         un-drafts the release and refreshes dev.json on the rolling
#                   desktop-dev prerelease; checks out and runs nothing.
# macOS and Windows ship unsigned; their updater only links to the release.
name: Desktop release
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/desktop/CHANGELOG.md
            apps/desktop/scripts/release-notes.sh
          sparse-checkout-cone-mode: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#desktop-v}
          # The version names a directory and is compared by the updater, so
          # it is X.Y.Z (final) or X.Y.Z-rc.N (release candidate), nothing else.
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
            || { echo "::error::$TAG is not desktop-vX.Y.Z or desktop-vX.Y.Z-rc.N"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-rc.*) echo "prerelease=true"; echo "channel=dev" ;;
            *) echo "prerelease=false"; echo "channel=stable" ;;
          esac >> "$GITHUB_OUTPUT"
      # The release notes are the CHANGELOG.md section for this version. A
      # missing or empty section fails here, before anything is built or signed.
      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          apps/desktop/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes/release-notes.md"
          cat "$RUNNER_TEMP/notes/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/release-notes.md
          if-no-files-found: error
          retention-days: 7

  # Nothing is built unless the tagged commit is on master, its `Desktop`
  # workflow passed (dispatched here when path filtering skipped it), and, for
  # a final tag, a published release candidate exists on the same commit.
  gate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      contents: read
      actions: write # dispatch the `Desktop` workflow when the commit has no run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/scripts
          sparse-checkout-cone-mode: true
      - name: Check the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: apps/desktop/scripts/release-gate.sh

  build:
    name: Build ${{ matrix.label }}
    needs: [prepare, gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-24.04, cmake: "-DGGML_NATIVE=OFF -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF" }
          - { label: linux-arm64, os: ubuntu-24.04-arm, cmake: "-DGGML_NATIVE=OFF -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF" }
          - { label: windows-x64, os: windows-latest, cmake: "-DGGML_NATIVE=OFF" }
          - { label: macos-arm64, os: macos-26, cmake: "-DGGML_NATIVE=OFF" }
    defaults:
      run:
        working-directory: apps/desktop
    env:
      # The binary reports this version (build.rs), which the updater checks
      # a downloaded executable against. A release candidate belongs to the
      # dev channel, a final release to stable.
      HEX_VERSION: ${{ needs.prepare.outputs.version }}
      HEX_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      # Portable CPU kernels: ggml otherwise tunes to the build machine and the
      # release would crash on older CPUs. No system BLAS either, so the
      # executable needs no OpenBLAS runtime.
      TRANSCRIBE_CMAKE_ARGS: ${{ matrix.cmake }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # No build cache: a release is built from scratch from the tagged commit.
      - name: Install native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libopenblas-dev only satisfies build.rs's -lopenblas, which
          # --as-needed drops: the release links no system BLAS.
          sudo apt-get install -y clang cmake pkg-config python3 libasound2-dev \
            libssl-dev libgtk-3-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libxcursor-dev libxi-dev \
            libxrandr-dev libopenblas-dev libvulkan-dev glslc libshaderc-dev
          {
            echo BLA_VENDOR=OpenBLAS
            echo OPENSSL_NO_VENDOR=1
            echo CC=clang
            echo CXX=clang++
          } >> "$GITHUB_ENV"
      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV-Headers for the Vulkan backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
      - name: Install the Metal toolchain (macOS)
        if: runner.os == 'macOS'
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - run: cargo build --locked --release

      - name: Collect the release file
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          # Windows runners give D:\a\_temp style paths; Git Bash wants /d/a/_temp.
          temp=$RUNNER_TEMP
          if command -v cygpath > /dev/null; then temp=$(cygpath -u "$RUNNER_TEMP"); fi
          dist="$temp/dist"
          mkdir -p "$dist"
          exe=target/release/wordink
          if [ "$RUNNER_OS" = Windows ]; then exe=target/release/wordink.exe; fi
          reported=$("$exe" --version | awk 'NF { value=$NF } END { print value }')
          [ "$reported" = "$HEX_VERSION" ] || { echo "::error::wordink reports $reported, not $HEX_VERSION"; exit 1; }
          name="wordink-$HEX_VERSION-$LABEL"
          case "$RUNNER_OS" in
            Linux)
              # The bare executable: what the updater downloads and the
              # signature covers. package-linux makes the tarball from it.
              install -m 755 "$exe" "$dist/$name"
              ;;
            macOS)
              # The bare executable in a zip: Hex's build-app.sh needs its
              # Developer ID signing inputs, so there is no .app yet.
              stage=$(mktemp -d)/wordink
              mkdir -p "$stage"
              install -m 755 "$exe" "$stage/wordink"
              cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
              (cd "$(dirname "$stage")" && zip -qr "$dist/$name.zip" wordink)
              ;;
            Windows)
              stage=$(mktemp -d)/wordink
              mkdir -p "$stage"
              cp "$exe" LICENSE THIRD_PARTY_NOTICES.md "$stage/"
              powershell -NoProfile -Command "Compress-Archive -Path '$(cygpath -w "$stage")' -DestinationPath '$(cygpath -w "$dist/$name.zip")'"
              ;;
          esac
          ls -l "$dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.label }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  sbom:
    needs: [prepare, gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: apps/desktop
          format: cyclonedx-json
          output-file: wordink-${{ needs.prepare.outputs.version }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: wordink-${{ needs.prepare.outputs.version }}.sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Linux tarballs, assembled before signing and without secrets so that the
  # signed SHA256SUMS can cover them.
  package-linux:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      WORDINK_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: build-linux-*
          path: ${{ runner.temp }}/in
          merge-multiple: true
      - name: Make the tarballs
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            apps/desktop/packaging/linux/make-tarball.sh "$RUNNER_TEMP/in" "$arch"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tarballs
          path: ${{ runner.temp }}/in/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The only job with the signing key. The `release` environment requires the
  # owner's approval before it starts. Order matters: the binaries are signed,
  # then the update manifest and SHA256SUMS are written over every file
  # (signatures included), then SHA256SUMS is signed. Only the two
  # sign-linux.sh steps are given the key.
  sign-linux:
    needs: [prepare, build, sbom, package-linux]
    runs-on: ubuntu-24.04
    environment: release
    env:
      WORDINK_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Only the signing scripts and the public key they check against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/packaging/linux
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "{build-*,sbom,tarballs}"
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Check the files this release defines
        run: |
          set -euo pipefail
          v=$WORDINK_VERSION
          cd "$RUNNER_TEMP/release"
          expected=$(printf '%s\n' \
            "wordink-$v-linux-x64" "wordink-$v-linux-x64.tar.gz" \
            "wordink-$v-linux-arm64" "wordink-$v-linux-arm64.tar.gz" \
            "wordink-$v-windows-x64.zip" "wordink-$v-macos-arm64.zip" \
            "wordink-$v.sbom.cdx.json" | LC_ALL=C sort)
          found=$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          [ "$expected" = "$found" ] || { echo "::error::unexpected release files"; diff <(echo "$expected") <(echo "$found") || true; exit 1; }
      - name: Sign the Linux executables
        env:
          WORDINK_LINUX_SIGNING_KEY: ${{ secrets.WORDINK_LINUX_SIGNING_KEY }}
        run: apps/desktop/packaging/linux/sign-linux.sh "$RUNNER_TEMP/release"
      # Every release carries dev.json; a final also carries stable.json. They
      # sit in the release before SHA256SUMS is written, so both are listed and
      # signed there, and `publish` copies dev.json to the rolling feed.
      - name: Write the update manifests
        env:
          WORDINK_TAG: ${{ github.ref_name }}
          WORDINK_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          apps/desktop/packaging/linux/write-manifest.sh "$RUNNER_TEMP/release" dev
          if [ "$PRERELEASE" = false ]; then
            apps/desktop/packaging/linux/write-manifest.sh "$RUNNER_TEMP/release" stable
          fi
      - name: List every file in SHA256SUMS
        run: apps/desktop/packaging/linux/write-sums.sh "$RUNNER_TEMP/release"
      - name: Sign SHA256SUMS
        env:
          WORDINK_LINUX_SIGNING_KEY: ${{ secrets.WORDINK_LINUX_SIGNING_KEY }}
        run: apps/desktop/packaging/linux/sign-linux.sh --sums "$RUNNER_TEMP/release"
      - name: Verify the signed release
        run: apps/desktop/packaging/linux/verify-release.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  # Uploads every file as a DRAFT release, checks the draft holds exactly the
  # files in SHA256SUMS, and stops there. Nothing is public until `publish`.
  draft:
    needs: [prepare, sign-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      WORDINK_VERSION: ${{ needs.prepare.outputs.version }}
      WORDINK_TAG: ${{ github.ref_name }}
      WORDINK_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/packaging/linux
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      # Re-check what the signing job produced before it leaves the runner.
      - run: apps/desktop/packaging/linux/verify-release.sh "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Create the draft release
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--draft --verify-tag --title "WordInk desktop $WORDINK_VERSION" --notes-file "$RUNNER_TEMP/notes/release-notes.md")
          # A release candidate is a prerelease and never the latest release.
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          gh release create "$WORDINK_TAG" -R "$WORDINK_REPO" "${flags[@]}" "$RUNNER_TEMP"/release/*
          expected=$(find "$RUNNER_TEMP/release" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          uploaded=$(gh release view "$WORDINK_TAG" -R "$WORDINK_REPO" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          [ "$expected" = "$uploaded" ] || { echo "::error::the draft's assets differ from the release files"; diff <(echo "$expected") <(echo "$uploaded") || true; exit 1; }

  # smoke (U9) goes here: read-only jobs with `needs: [prepare, draft]` that
  # install the draft's assets with the one-line installers and start the app.
  # Add each one to `publish`'s `needs` so a failed smoke keeps the release a draft.

  # The only job that makes the release public. It checks out and runs nothing.
  publish:
    needs: [prepare, draft]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      WORDINK_TAG: ${{ github.ref_name }}
      WORDINK_REPO: ${{ github.repository }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the draft
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$WORDINK_TAG" -R "$WORDINK_REPO" --draft=false --prerelease --latest=false
          else
            gh release edit "$WORDINK_TAG" -R "$WORDINK_REPO" --draft=false --prerelease=false --latest
          fi
      # The Dev channel reads dev.json from the rolling `desktop-dev` prerelease
      # (never latest). The copy is the file SHA256SUMS signed, fetched from the
      # release just published; manifests are unsigned themselves, as stable.json.
      - name: Refresh the Dev feed
        run: |
          set -euo pipefail
          gh release view desktop-dev -R "$WORDINK_REPO" > /dev/null 2>&1 \
            || gh release create desktop-dev -R "$WORDINK_REPO" --prerelease --latest=false \
              --title "WordInk desktop Dev feed" \
              --notes "Rolling feed for the Dev update channel. It holds only dev.json; install from the desktop-v* releases."
          mkdir "$RUNNER_TEMP/feed"
          gh release download "$WORDINK_TAG" -R "$WORDINK_REPO" -p dev.json -D "$RUNNER_TEMP/feed"
          gh release upload desktop-dev -R "$WORDINK_REPO" --clobber "$RUNNER_TEMP/feed/dev.json"
