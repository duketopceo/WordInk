# Desktop release: a `desktop-v<version>` tag builds the app on the four
# platforms, packs the installers (Windows Setup .exe, macOS .dmg, Linux
# AppImage, .deb, .rpm and tarball), signs the Linux executables and the
# checksum list, and publishes one GitHub Release with SHA256SUMS(.sig), an
# SBOM, build-provenance attestations and the update manifests (dev.json, plus
# stable.json on a final) the in-app updater reads.
# Tags are `desktop-vX.Y.Z` (final, channel stable, marked latest) and
# `desktop-vX.Y.Z-rc.N` (release candidate, channel dev, prerelease, never
# latest). See docs/releasing.md for the runbook.
#
# Dry run: a manual dispatch (workflow_dispatch, dry_run=true; anyone who can
# dispatch has write access) builds and packs everything as version
# 0.0.0-dryrun.<run number> and uploads the files as workflow artifacts only.
# gate, sign-linux, draft, fetch-draft, smoke and publish each run only for a
# `push` of a `desktop-v*` tag, so a dispatched run never sees the signing key,
# never creates a tag or a release, and has no job with contents: write.
# dry_run=false is refused: releasing is always a tag push.
#
# Job graph:
#   prepare -> gate -> build (x4), sbom -> package-linux -> check-installers (x4)
#           -> sign-linux -> draft -> fetch-draft -> smoke (x4) -> publish
#   dry run: prepare -> build (x4), sbom -> package-linux -> check-installers
#           -> dry-run-bundle
#
# Trust boundaries:
#   prepare, gate   read-only; no secrets. gate only calls the GitHub API.
#   build           runs repository code (cargo, build.rs); no secrets, read-only.
#                   The Windows and macOS legs also pack the Setup .exe (Inno
#                   Setup) and the .dmg (hdiutil).
#   package-linux   assembles the Linux tarballs, AppImages, .deb and .rpm from
#                   the build output with pinned, checksummed tools, and
#                   gathers the three one-line installers (install.sh,
#                   install-macos.sh, install.ps1); no secrets. It runs before
#                   signing so the signed SHA256SUMS covers all of them.
#   check-installers read-only, no secrets, no checkout: installs the packed
#                   .exe, .dmg, AppImage, .deb and .rpm on each OS and checks
#                   `wordink --version`. A failure stops the run before signing.
#   dry-run-bundle  dispatch only: lists the files in an unsigned SHA256SUMS and
#                   uploads them as one workflow artifact; no secrets.
#   sign-linux      the only job that can read WORDINK_LINUX_SIGNING_KEY. It
#                   sits in the protected `release` environment, so the owner
#                   approves it. Only its two `sign-linux.sh` steps hold the
#                   key; everything built is treated as data and never run.
#   draft           uploads the assets as a DRAFT release; holds no signing key.
#   fetch-draft     copies the draft's assets into a workflow artifact with the
#                   job token; checks out and runs nothing.
#   smoke           read-only, no secrets, no checkout: installs the draft's
#                   assets on each OS with the published installers, from a
#                   loopback server, and checks `wordink --version`. A failure
#                   keeps the release a draft.
#   publish         un-drafts the release and refreshes dev.json on the rolling
#                   desktop-dev prerelease; checks out and runs nothing.
# macOS and Windows ship unsigned (no Authenticode, no notarization); their
# updater only links to the release.
name: Desktop release
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack the installers as workflow artifacts only (no signing, tag or release). Must stay true."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      channel: ${{ steps.version.outputs.channel }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/desktop/CHANGELOG.md
            apps/desktop/scripts/release-notes.sh
          sparse-checkout-cone-mode: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            # A dispatched run is only ever a dry run; releasing is a tag push.
            [ "$DRY_RUN" = true ] || { echo "::error::A dispatched run is always a dry run; push a desktop-v* tag to release."; exit 1; }
            {
              echo "version=0.0.0-dryrun.$RUN_NUMBER"
              echo "prerelease=true"
              echo "channel=dev"
              echo "dry_run=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$GITHUB_REF" in
            refs/tags/desktop-v*) ;;
            *) echo "::error::$GITHUB_REF is not a desktop-v* tag"; exit 1 ;;
          esac
          echo "dry_run=false" >> "$GITHUB_OUTPUT"
          version=${TAG#desktop-v}
          # The version names a directory and is compared by the updater, so
          # it is X.Y.Z (final) or X.Y.Z-rc.N (release candidate), nothing else.
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' \
            || { echo "::error::$TAG is not desktop-vX.Y.Z or desktop-vX.Y.Z-rc.N"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-rc.*) echo "prerelease=true"; echo "channel=dev" ;;
            *) echo "prerelease=false"; echo "channel=stable" ;;
          esac >> "$GITHUB_OUTPUT"
      # The release notes are the CHANGELOG.md section for this version. A
      # missing or empty section fails here, before anything is built or signed.
      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ steps.version.outputs.dry_run }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run $VERSION: not a release." > "$RUNNER_TEMP/notes/release-notes.md"
          else
            apps/desktop/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes/release-notes.md"
          fi
          cat "$RUNNER_TEMP/notes/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/release-notes.md
          if-no-files-found: error
          retention-days: 7

  # Nothing is built unless the tagged commit is on master, its `Desktop`
  # workflow passed (dispatched here when path filtering skipped it), and, for
  # a final tag, a published release candidate exists on the same commit.
  gate:
    needs: prepare
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      contents: read
      actions: write # dispatch the `Desktop` workflow when the commit has no run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/scripts
          sparse-checkout-cone-mode: true
      - name: Check the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: apps/desktop/scripts/release-gate.sh

  build:
    name: Build ${{ matrix.label }}
    needs: [prepare, gate]
    # After a passing gate, or in a dry run, where gate is skipped.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.gate.result == 'skipped'))
    # The macos-arm64 leg runs on the owner's own Mac (runner label `promax-macos`,
    # registered on this repo only, started by a tag push or an owner-dispatched
    # dry run, never by pull_request).
    # Hosted fallback: set the repo variable WORDINK_MACOS_RUNNER=hosted and the
    # leg goes back to the GitHub-hosted `macos-26` image, no file change needed.
    # The self-hosted Mac needs Xcode + Metal toolchain, rustup and cmake.
    runs-on: ${{ (matrix.label == 'macos-arm64' && vars.WORDINK_MACOS_RUNNER != 'hosted') && fromJSON('["self-hosted","promax-macos"]') || matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-24.04, cmake: "-DGGML_NATIVE=OFF -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF" }
          - { label: linux-arm64, os: ubuntu-24.04-arm, cmake: "-DGGML_NATIVE=OFF -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF" }
          - { label: windows-x64, os: windows-latest, cmake: "-DGGML_NATIVE=OFF" }
          - { label: macos-arm64, os: macos-26, cmake: "-DGGML_NATIVE=OFF" }
    defaults:
      run:
        working-directory: apps/desktop
    env:
      # The binary reports this version (build.rs), which the updater checks
      # a downloaded executable against. A release candidate belongs to the
      # dev channel, a final release to stable.
      HEX_VERSION: ${{ needs.prepare.outputs.version }}
      HEX_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      # Portable CPU kernels: ggml otherwise tunes to the build machine and the
      # release would crash on older CPUs. No system BLAS either, so the
      # executable needs no OpenBLAS runtime.
      TRANSCRIBE_CMAKE_ARGS: ${{ matrix.cmake }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # No build cache: a release is built from scratch from the tagged commit.
      - name: Install native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libopenblas-dev only satisfies build.rs's -lopenblas, which
          # --as-needed drops: the release links no system BLAS.
          sudo apt-get install -y clang cmake pkg-config python3 libasound2-dev \
            libssl-dev libgtk-3-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libxcursor-dev libxi-dev \
            libxrandr-dev libopenblas-dev libvulkan-dev glslc libshaderc-dev
          {
            echo BLA_VENDOR=OpenBLAS
            echo OPENSSL_NO_VENDOR=1
            echo CC=clang
            echo CXX=clang++
          } >> "$GITHUB_ENV"
      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV-Headers for the Vulkan backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
      - name: Install the Metal toolchain (macOS)
        if: runner.os == 'macOS'
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - run: cargo build --locked --release

      - name: Collect the release file
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          # Windows runners give D:\a\_temp style paths; Git Bash wants /d/a/_temp.
          temp=$RUNNER_TEMP
          if command -v cygpath > /dev/null; then temp=$(cygpath -u "$RUNNER_TEMP"); fi
          dist="$temp/dist"
          mkdir -p "$dist"
          exe=target/release/wordink
          if [ "$RUNNER_OS" = Windows ]; then exe=target/release/wordink.exe; fi
          reported=$("$exe" --version | awk 'NF { value=$NF } END { print value }')
          [ "$reported" = "$HEX_VERSION" ] || { echo "::error::wordink reports $reported, not $HEX_VERSION"; exit 1; }
          name="wordink-$HEX_VERSION-$LABEL"
          case "$RUNNER_OS" in
            Linux)
              # The bare executable: what the updater downloads and the
              # signature covers. package-linux makes the tarball from it.
              install -m 755 "$exe" "$dist/$name"
              ;;
            macOS)
              # The unsigned release app bundle; build-app.sh prints its path
              # (<cargo target dir>/app/WordInk.app). The zip root is WordInk.app/.
              bundle=$(HEX_RELEASE_UNSIGNED=1 scripts/build-app.sh | tail -n 1)
              [ -d "$bundle" ] || { echo "::error::build-app.sh did not produce a bundle ($bundle)"; exit 1; }
              reported=$("$bundle/Contents/MacOS/wordink" --version | awk 'NF { value=$NF } END { print value }')
              [ "$reported" = "$HEX_VERSION" ] || { echo "::error::the app reports $reported, not $HEX_VERSION"; exit 1; }
              ditto -c -k --keepParent "$bundle" "$dist/$name.zip"
              # The drag-to-Applications disk image (unsigned, not notarized).
              packaging/macos/make-dmg.sh "$bundle" "$dist/WordInk-macos-arm64.dmg"
              ;;
            Windows)
              stage=$(mktemp -d)/wordink
              mkdir -p "$stage"
              cp "$exe" LICENSE THIRD_PARTY_NOTICES.md "$stage/"
              powershell -NoProfile -Command "Compress-Archive -Path '$(cygpath -w "$stage")' -DestinationPath '$(cygpath -w "$dist/$name.zip")'"
              # The per-user Setup .exe (Inno Setup, packaging/windows/wordink.iss),
              # unsigned. Its name carries no version, so README links can
              # use releases/latest/download/WordInk-Setup-windows-x64.exe.
              setup="$temp/setup"
              pwsh -NoProfile -File scripts/build-windows-installer.ps1 -Executable "$(cygpath -w "$exe")" \
                -Version "$HEX_VERSION" -Arch x86_64 -OutDir "$(cygpath -w "$setup")"
              mv "$setup/wordink-setup-$HEX_VERSION-windows-x64.exe" "$dist/WordInk-Setup-windows-x64.exe"
              ;;
          esac
          ls -l "$dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.label }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  sbom:
    needs: [prepare, gate]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.gate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.gate.result == 'skipped'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: apps/desktop
          format: cyclonedx-json
          output-file: wordink-${{ needs.prepare.outputs.version }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: wordink-${{ needs.prepare.outputs.version }}.sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  # Linux tarballs, AppImages, .deb and .rpm, assembled before signing and
  # without secrets so that the signed SHA256SUMS can cover them. The AppImage
  # and package names carry no version (releases/latest/download/<name>).
  package-linux:
    needs: [prepare, build]
    # Explicit results: in a dry run gate is skipped, and the implicit
    # success() would skip every job downstream of it.
    if: "!cancelled() && needs.build.result == 'success'"
    runs-on: ubuntu-24.04
    env:
      WORDINK_VERSION: ${{ needs.prepare.outputs.version }}
      # Pinned packaging tools, checked against these SHA-256 sums before use.
      NFPM_URL: https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108
      RUNTIME_X86_64_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
      RUNTIME_AARCH64_SHA256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: build-linux-*
          path: ${{ runner.temp }}/in
          merge-multiple: true
      - name: Make the tarballs
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            apps/desktop/packaging/linux/make-tarball.sh "$RUNNER_TEMP/in" "$arch"
          done
      - name: Fetch the packaging tools
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools/runtime"
          curl -fsSL -o "$tools/nfpm.tar.gz" "$NFPM_URL"
          curl -fsSL -o "$tools/appimagetool" "$APPIMAGETOOL_URL"
          curl -fsSL -o "$tools/runtime/runtime-x86_64" "$RUNTIME_URL/runtime-x86_64"
          curl -fsSL -o "$tools/runtime/runtime-aarch64" "$RUNTIME_URL/runtime-aarch64"
          sha256sum --check --strict <<SUMS
          $NFPM_SHA256  $tools/nfpm.tar.gz
          $APPIMAGETOOL_SHA256  $tools/appimagetool
          $RUNTIME_X86_64_SHA256  $tools/runtime/runtime-x86_64
          $RUNTIME_AARCH64_SHA256  $tools/runtime/runtime-aarch64
          SUMS
          tar -xzf "$tools/nfpm.tar.gz" -C "$tools" nfpm
          chmod 755 "$tools/nfpm" "$tools/appimagetool"
      - name: Make the AppImages, .deb and .rpm
        env:
          # appimagetool is itself an AppImage; the runner has no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          out="$RUNNER_TEMP/packages"
          mkdir -p "$out"
          for arch in x64 arm64; do
            executable="$RUNNER_TEMP/in/wordink-$WORDINK_VERSION-linux-$arch"
            NFPM="$tools/nfpm" apps/desktop/scripts/package-linux.sh "$executable" "$WORDINK_VERSION" "$arch" "$out"
            APPIMAGETOOL="$tools/appimagetool" APPIMAGE_RUNTIME_DIR="$tools/runtime" \
              apps/desktop/packaging/linux/make-appimage.sh "$executable" "$arch" "$out"
          done
          dpkg-deb --info "$out/wordink_amd64.deb"
          ls -l "$out"
      # The one-line installers are release assets under these exact names
      # (`.../releases/latest/download/<name>` is the URL users run).
      - name: Collect the installers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installers"
          install -m 755 apps/desktop/packaging/linux/install.sh "$RUNNER_TEMP/installers/install.sh"
          install -m 755 apps/desktop/packaging/macos/install-macos.sh "$RUNNER_TEMP/installers/install-macos.sh"
          install -m 644 apps/desktop/packaging/windows/install.ps1 "$RUNNER_TEMP/installers/install.ps1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers
          path: ${{ runner.temp }}/installers/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tarballs
          path: ${{ runner.temp }}/in/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 7

  # Installs each packed installer the way a user would, on a clean runner, and
  # checks the installed program reports this run's version. Read-only, no
  # secrets, no checkout: only the built files run. These are the exact bytes
  # sign-linux lists in SHA256SUMS, so a broken installer is never signed.
  check-installers:
    name: Check installers ${{ matrix.label }}
    needs: [prepare, build, package-linux]
    if: "!cancelled() && needs.build.result == 'success' && needs.package-linux.result == 'success'"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-24.04, artifact: linux-packages, deb: wordink_amd64.deb, rpm: wordink-x86_64.rpm, appimage: WordInk-linux-x86_64.AppImage }
          - { label: linux-arm64, os: ubuntu-24.04-arm, artifact: linux-packages, deb: wordink_arm64.deb, rpm: wordink-aarch64.rpm, appimage: WordInk-linux-aarch64.AppImage }
          - { label: windows-x64, os: windows-latest, artifact: build-windows-x64 }
          - { label: macos-arm64, os: macos-26, artifact: build-macos-arm64 }
    env:
      WORDINK_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/files
      - name: .deb, .rpm and AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          DEB: ${{ matrix.deb }}
          RPM: ${{ matrix.rpm }}
          APPIMAGE: ${{ matrix.appimage }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/files"
          check() { # <label> <command...>
            local label=$1 reported
            shift
            reported=$("$@" --version | awk 'NF { value=$NF } END { print value }')
            [ "$reported" = "$WORDINK_VERSION" ] || { echo "::error::$label reports $reported, not $WORDINK_VERSION"; exit 1; }
            echo "$label reports $reported"
          }
          echo "::group::.deb"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "./$DEB"
          echo "::endgroup::"
          check .deb /usr/bin/wordink
          [ -f /usr/share/applications/io.github.duketopceo.wordink.desktop ] || { echo "::error::the .deb installed no desktop entry"; exit 1; }
          # The AppImage, unpacked (the runner has no FUSE), on the libraries
          # the .deb pulled in.
          chmod 755 "$APPIMAGE"
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/files/$APPIMAGE" --appimage-extract > /dev/null)
          check AppImage "$RUNNER_TEMP/squashfs-root/AppRun"
          sudo apt-get remove -y wordink
          [ ! -e /usr/bin/wordink ] || { echo "::error::removing the .deb left /usr/bin/wordink"; exit 1; }
          echo "::group::.rpm on Fedora"
          docker run --rm -v "$PWD:/files:ro" -e WORDINK_VERSION fedora:42 sh -euc '
            dnf install -y -q "/files/$0"
            reported=$(wordink --version | awk "NF { value=\$NF } END { print value }")
            [ "$reported" = "$WORDINK_VERSION" ] || { echo "::error::.rpm reports $reported, not $WORDINK_VERSION"; exit 1; }
            echo ".rpm reports $reported"
            dnf remove -y -q wordink
            [ ! -e /usr/bin/wordink ]' "$RPM"
          echo "::endgroup::"
      - name: Setup .exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'files\WordInk-Setup-windows-x64.exe'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\WordInk'
          $exe = Join-Path $dir 'wordink.exe'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\WordInk.lnk'
          $uninstaller = Join-Path $env:LOCALAPPDATA 'WordInk\uninstall\unins000.exe'
          # The runner has no GPU driver, so skip the installer's Vulkan check.
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SKIPVULKANCHECK=1', '/TASKS=startup' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)" }
          if (-not (Test-Path $exe)) { throw "$exe is not installed" }
          $reported = (((& $exe --version) | Out-String).Trim() -split '\s+')[-1]
          if ($reported -ne $env:WORDINK_VERSION) { throw "wordink reports $reported, not $env:WORDINK_VERSION" }
          Write-Host "Setup installed wordink $reported"
          if ((Get-Content (Join-Path $dir 'install-receipt.txt') -TotalCount 1).Trim() -ne $env:WORDINK_VERSION) { throw 'install-receipt.txt does not hold the version' }
          if (-not (Test-Path $shortcut)) { throw 'no Start Menu shortcut' }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name WordInk -ErrorAction SilentlyContinue).WordInk
          if ($run -ne ('"{0}" app --hidden' -f $exe)) { throw "unexpected Run value: $run" }
          if (Test-Path (Join-Path $env:APPDATA 'wordink\install.json')) { throw 'Setup wrote an install.json receipt' }
          $p = Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the uninstaller exited with $($p.ExitCode)" }
          # The uninstaller hands off to a copy of itself; give it a moment.
          for ($i = 0; $i -lt 60 -and ((Test-Path $exe) -or (Test-Path $shortcut)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $exe) { throw "uninstall left $exe" }
          if (Test-Path $shortcut) { throw 'uninstall left the Start Menu shortcut' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name WordInk -ErrorAction SilentlyContinue)) { throw 'uninstall left the Run value' }
          Write-Host 'Setup installs and uninstalls cleanly.'
      - name: .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mnt="$RUNNER_TEMP/mnt"
          mkdir -p "$mnt"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mnt" "$RUNNER_TEMP/files/WordInk-macos-arm64.dmg"
          trap 'hdiutil detach -quiet "$mnt" || true' EXIT
          [ "$(readlink "$mnt/Applications")" = /Applications ] || { echo "::error::the .dmg has no Applications link"; exit 1; }
          [ -f "$mnt/.VolumeIcon.icns" ] || { echo "::error::the .dmg has no volume icon"; exit 1; }
          reported=$("$mnt/WordInk.app/Contents/MacOS/wordink" --version | awk 'NF { value=$NF } END { print value }')
          [ "$reported" = "$WORDINK_VERSION" ] || { echo "::error::the .dmg's WordInk.app reports $reported, not $WORDINK_VERSION"; exit 1; }
          echo "the .dmg's WordInk.app reports $reported"

  # The only job with the signing key. The `release` environment requires the
  # owner's approval before it starts. Order matters: the binaries are signed,
  # then the update manifest and SHA256SUMS are written over every file
  # (signatures included), then SHA256SUMS is signed. Only the two
  # sign-linux.sh steps are given the key.
  sign-linux:
    needs: [prepare, build, sbom, package-linux, check-installers]
    # Never in a dry run: only a pushed desktop-v* tag reaches the key.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    environment: release
    env:
      WORDINK_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Only the signing scripts and the public key they check against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/packaging/linux
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "{build-*,sbom,tarballs,installers,linux-packages}"
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Check the files this release defines
        run: apps/desktop/packaging/linux/check-release-files.sh "$RUNNER_TEMP/release"
      - name: Sign the Linux executables
        env:
          WORDINK_LINUX_SIGNING_KEY: ${{ secrets.WORDINK_LINUX_SIGNING_KEY }}
        run: apps/desktop/packaging/linux/sign-linux.sh "$RUNNER_TEMP/release"
      # Every release carries dev.json; a final also carries stable.json. They
      # sit in the release before SHA256SUMS is written, so both are listed and
      # signed there, and `publish` copies dev.json to the rolling feed.
      - name: Write the update manifests
        env:
          WORDINK_TAG: ${{ github.ref_name }}
          WORDINK_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          apps/desktop/packaging/linux/write-manifest.sh "$RUNNER_TEMP/release" dev
          if [ "$PRERELEASE" = false ]; then
            apps/desktop/packaging/linux/write-manifest.sh "$RUNNER_TEMP/release" stable
          fi
      - name: List every file in SHA256SUMS
        run: apps/desktop/packaging/linux/write-sums.sh "$RUNNER_TEMP/release"
      - name: Sign SHA256SUMS
        env:
          WORDINK_LINUX_SIGNING_KEY: ${{ secrets.WORDINK_LINUX_SIGNING_KEY }}
        run: apps/desktop/packaging/linux/sign-linux.sh --sums "$RUNNER_TEMP/release"
      - name: Verify the signed release
        run: apps/desktop/packaging/linux/verify-release.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  # Uploads every file as a DRAFT release, checks the draft holds exactly the
  # files in SHA256SUMS, and stops there. Nothing is public until `publish`.
  draft:
    needs: [prepare, sign-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      WORDINK_VERSION: ${{ needs.prepare.outputs.version }}
      WORDINK_TAG: ${{ github.ref_name }}
      WORDINK_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/packaging/linux
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      # Re-check what the signing job produced before it leaves the runner.
      - run: apps/desktop/packaging/linux/verify-release.sh "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Create the draft release
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--draft --verify-tag --title "WordInk desktop $WORDINK_VERSION" --notes-file "$RUNNER_TEMP/notes/release-notes.md")
          # A release candidate is a prerelease and never the latest release.
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          gh release create "$WORDINK_TAG" -R "$WORDINK_REPO" "${flags[@]}" "$RUNNER_TEMP"/release/*
          expected=$(find "$RUNNER_TEMP/release" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          uploaded=$(gh release view "$WORDINK_TAG" -R "$WORDINK_REPO" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          [ "$expected" = "$uploaded" ] || { echo "::error::the draft's assets differ from the release files"; diff <(echo "$expected") <(echo "$uploaded") || true; exit 1; }

  # Copies the draft's assets into a workflow artifact for the smoke jobs. The
  # job token needs contents: write to see a draft release; the job checks out
  # and runs nothing, and the smoke jobs that execute the assets get no token.
  fetch-draft:
    needs: [prepare, draft]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      WORDINK_TAG: ${{ github.ref_name }}
      WORDINK_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the draft's assets
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/draft"
          mkdir -p "$dir"
          gh release download "$WORDINK_TAG" -R "$WORDINK_REPO" --dir "$dir"
          # What was uploaded is what was signed.
          (cd "$dir" && sha256sum --check --strict --quiet SHA256SUMS)
          ls -l "$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: draft-assets
          path: ${{ runner.temp }}/draft/*
          if-no-files-found: error
          retention-days: 1

  # Install the draft's assets the way a user does (the published one-line
  # installer, run from a loopback server in place of GitHub Releases), check the
  # installed program reports the tag's version, uninstall, and reinstall. Read-only,
  # no secrets, no checkout: only the downloaded assets run. The Linux runners
  # have no user systemd session, so the installer ends with its "run wordink app"
  # hint there, and that must still be a success.
  smoke:
    name: Smoke ${{ matrix.label }}
    needs: [prepare, fetch-draft]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-24.04 }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
          - { label: macos-arm64, os: macos-26 }
          - { label: windows-x64, os: windows-latest }
    env:
      WORDINK_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: draft-assets
          path: ${{ runner.temp }}/assets
      - name: Install, check, uninstall, reinstall (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) installer=install.sh ;;
            macOS) installer=install-macos.sh ;;
          esac
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          python3 -m http.server "$port" --bind 127.0.0.1 --directory "$RUNNER_TEMP/assets" > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          base=http://127.0.0.1:$port
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null "$base/SHA256SUMS" && break
            sleep 0.2
          done
          export WORDINK_INSTALL_BASE=$base
          if [ "$RUNNER_OS" = Linux ]; then
            wordink=$HOME/.local/bin/wordink
          else
            wordink=$HOME/Applications/WordInk.app/Contents/MacOS/wordink
          fi
          check_version() {
            [ -x "$wordink" ] || { echo "::error::$wordink is not installed"; exit 1; }
            reported=$("$wordink" --version | awk 'NF { value=$NF } END { print value }')
            [ "$reported" = "$WORDINK_VERSION" ] || { echo "::error::wordink reports $reported, not $WORDINK_VERSION"; exit 1; }
            echo "wordink reports $reported"
          }
          echo "::group::install"
          curl -fsSL "$base/$installer" | sh
          echo "::endgroup::"
          check_version
          echo "::group::uninstall"
          curl -fsSL "$base/$installer" | sh -s -- uninstall
          echo "::endgroup::"
          if [ -e "$wordink" ] || [ -L "$wordink" ]; then echo "::error::uninstall left $wordink"; exit 1; fi
          echo "::group::reinstall"
          curl -fsSL "$base/$installer" | sh
          echo "::endgroup::"
          check_version
      - name: Install, check, uninstall, reinstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'assets'
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $server = Start-Process python -ArgumentList '-m', 'http.server', $port, '--bind', '127.0.0.1', '--directory', $dir -PassThru -WindowStyle Hidden
          try {
            $base = "http://127.0.0.1:$port"
            for ($i = 0; $i -lt 50; $i++) {
              try { Invoke-WebRequest -UseBasicParsing "$base/SHA256SUMS" | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
            }
            $env:WORDINK_INSTALL_BASE = $base
            $exe = Join-Path $env:LOCALAPPDATA 'Programs\WordInk\wordink.exe'
            function Invoke-Installer {
              irm "$base/install.ps1" | iex
              if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed ($LASTEXITCODE)" }
            }
            function Test-Version {
              if (-not (Test-Path $exe)) { throw "$exe is not installed" }
              $reported = (((& $exe --version) | Out-String).Trim() -split '\s+')[-1]
              if ($reported -ne $env:WORDINK_VERSION) { throw "wordink reports $reported, not $env:WORDINK_VERSION" }
              Write-Host "wordink reports $reported"
            }
            Invoke-Installer
            Test-Version
            $env:WORDINK_UNINSTALL = '1'
            Invoke-Installer
            Remove-Item Env:WORDINK_UNINSTALL
            if (Test-Path $exe) { throw "uninstall left $exe" }
            Invoke-Installer
            Test-Version
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  # The only job that makes the release public. It checks out and runs nothing.
  publish:
    needs: [prepare, draft, smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      WORDINK_TAG: ${{ github.ref_name }}
      WORDINK_REPO: ${{ github.repository }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the draft
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$WORDINK_TAG" -R "$WORDINK_REPO" --draft=false --prerelease --latest=false
          else
            gh release edit "$WORDINK_TAG" -R "$WORDINK_REPO" --draft=false --prerelease=false --latest
          fi
      # The Dev channel reads dev.json from the rolling `desktop-dev` prerelease
      # (never latest). The copy is the file SHA256SUMS signed, fetched from the
      # release just published; manifests are unsigned themselves, as stable.json.
      - name: Refresh the Dev feed
        run: |
          set -euo pipefail
          gh release view desktop-dev -R "$WORDINK_REPO" > /dev/null 2>&1 \
            || gh release create desktop-dev -R "$WORDINK_REPO" --prerelease --latest=false \
              --title "WordInk desktop Dev feed" \
              --notes "Rolling feed for the Dev update channel. It holds only dev.json; install from the desktop-v* releases."
          mkdir "$RUNNER_TEMP/feed"
          gh release download "$WORDINK_TAG" -R "$WORDINK_REPO" -p dev.json -p SHA256SUMS -D "$RUNNER_TEMP/feed"
          # Only the dev.json that SHA256SUMS (signed in sign-linux) lists may reach the feed.
          (cd "$RUNNER_TEMP/feed" && grep -E '^[0-9a-f]{64}  dev\.json$' SHA256SUMS | sha256sum --check --strict)
          gh release upload desktop-dev -R "$WORDINK_REPO" --clobber "$RUNNER_TEMP/feed/dev.json"

  # Dry run only: gathers every file a release would carry, checks the set,
  # lists them in an unsigned SHA256SUMS and uploads them as one workflow
  # artifact. No secrets, no write access, no tag or release.
  dry-run-bundle:
    needs: [prepare, build, sbom, package-linux, check-installers]
    if: >-
      github.event_name == 'workflow_dispatch' && !cancelled() &&
      needs.build.result == 'success' && needs.sbom.result == 'success' &&
      needs.package-linux.result == 'success' && needs.check-installers.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      WORDINK_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/packaging/linux
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "{build-*,sbom,tarballs,installers,linux-packages}"
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Check and list the files
        run: |
          set -euo pipefail
          apps/desktop/packaging/linux/check-release-files.sh "$RUNNER_TEMP/release"
          apps/desktop/packaging/linux/write-sums.sh "$RUNNER_TEMP/release"
          {
            echo "### Dry run $WORDINK_VERSION"
            echo
            echo "Unsigned; not a release. Files (artifact \`dry-run-release\`):"
            echo
            echo '```'
            (cd "$RUNNER_TEMP/release" && ls -l)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dry-run-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7
