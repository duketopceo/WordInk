# Builds and tests the desktop app (apps/desktop, the `wordink` binary) on the
# four platforms it ships for. Adapted from Hex's check-linux, check-windows and
# check-macos workflows; it has no secrets, no environment and read-only access.
name: Desktop
on:
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  push:
    branches: [master, "ci/**"]
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the stale run of the same branch or pull request.
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04 }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: Windows x64, os: windows-latest }
          # Two GPU-rendered capture-capsule tests compare against goldens made
          # on real Apple GPUs; the runner's Metal device draws other pixels.
          # The capture experiment is off by default in WordInk.
          - name: macOS arm64
            os: macos-26
            skip: >-
              --skip rune_ui::capture_capsule::tests::capture_capsule_goldens
              --skip rune_ui::capture_capsule::tests::the_capsule_moves_inside_its_panel_and_comes_to_rest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Portable CPU kernels: without this, ggml tunes to the runner's CPU.
      TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop
          cache-on-failure: true

      - name: Install native libraries (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config python3 libasound2-dev \
            libssl-dev libgtk-3-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libxcursor-dev libxi-dev \
            libxrandr-dev libopenblas-dev libvulkan-dev glslc libshaderc-dev
          # Hex's Linux settings: the system OpenBLAS satisfies build.rs's
          # -lopenblas, and clang builds the native code.
          {
            echo BLA_VENDOR=OpenBLAS
            echo OPENSSL_NO_VENDOR=1
            echo CC=clang
            echo CXX=clang++
          } >> "$GITHUB_ENV"
      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV-Headers for the Vulkan backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
      - name: Install the Metal toolchain (macOS)
        if: runner.os == 'macOS'
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Release scripts (shellcheck and tests)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          shellcheck packaging/linux/{sign-linux,make-tarball,write-sums,verify-release,write-manifest}.sh \
            scripts/{release-gate,release-notes,test-release-scripts}.sh
          scripts/test-release-scripts.sh

      # The installers (one per OS) against a loopback fixture release. The
      # Linux one needs the bootstrap installer from the Linux installer change
      # (packaging/linux/install.sh): until that is on this branch the step is
      # skipped, because the older test script it replaces cannot run.
      - name: Installer tests (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -eu
          shellcheck packaging/macos/install-macos.sh scripts/test-install-macos.sh
          # The macOS installer test fakes the macOS commands, so one arch is enough.
          if [ "$(uname -m)" = x86_64 ]; then sh scripts/test-install-macos.sh; fi
          if [ -f packaging/linux/install.sh ]; then
            shellcheck packaging/linux/install.sh packaging/linux/install-release.sh scripts/test-install-linux-release.sh
            sh scripts/test-install-linux-release.sh
          else
            echo "::notice::packaging/linux/install.sh is not on this branch; skipping the Linux installer test."
          fi
      - name: Installer test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            $findings = Invoke-ScriptAnalyzer -Path packaging/windows/install.ps1 -Severity Error, Warning `
              -ExcludeRule PSAvoidUsingWriteHost
            $findings | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap
            if ($findings | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer reported errors in install.ps1' }
          } else {
            Write-Host '::notice::PSScriptAnalyzer is not installed on this runner; skipped.'
          }
          pwsh -NoProfile -File scripts/test-windows-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "test-windows-installer.ps1 failed ($LASTEXITCODE)" }

      - name: Clippy
        # Hex's own CI lints the same way; tests are linted on Linux, where
        # the suite runs in full.
        run: cargo clippy --locked --bin wordink ${{ runner.os == 'Linux' && '--tests' || '' }} -- -D warnings
      - run: cargo build --locked --release
      # Split, because tests/keyboard_layout.rs has its own harness that
      # rejects libtest's --skip.
      - run: cargo test --locked --bin wordink -- ${{ matrix.skip }}
      - run: cargo test --locked --test '*'
