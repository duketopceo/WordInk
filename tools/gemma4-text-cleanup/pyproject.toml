[project]
name = "wordink-gemma4-text-cleanup"
version = "0.1.0"
description = "Gemma 4 E2B dictation text-cleanup dataset builder and fine-tuning helpers for WordInk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
train-cuda = [
    "transformers>=5.10.1",
    "trl>=0.22",
    "peft>=0.17",
    "datasets>=3.6",
    "accelerate>=1.6",
    "bitsandbytes>=0.45; sys_platform == 'linux'",
    "torch>=2.6; sys_platform == 'linux'",
]
train-mlx = [
    "mlx>=0.26",
    "mlx-lm>=0.24",
]

[project.scripts]
wordink-gemma-dataset = "wordink_gemma4.builder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wordink_gemma4"]

[tool.pytest.ini_options]
testpaths = ["tests"]