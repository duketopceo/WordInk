[project]
name = "wordink"
version = "0.1.0"
description = "Dictation CLI and MCP tools that talk to a wordink-gateway (or any OpenAI-compatible transcriptions endpoint)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.5"]

[project.scripts]
wordink = "wordink.cli:main"
wordink-mcp = "wordink.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordink"]

[tool.uv]
package = true
