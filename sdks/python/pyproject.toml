[project]
name = "wordink"
version = "0.1.0"
description = "Dictation CLI and MCP tools that talk to a wordink-gateway (or any OpenAI-compatible transcriptions endpoint)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.5"]
macos = [
    "keyring>=25; sys_platform == 'darwin'",
    "sounddevice>=0.5; sys_platform == 'darwin'",
    "rumps>=0.4; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]
windows = [
    "keyring>=25; sys_platform == 'win32'",
    "sounddevice>=0.5; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
]

[project.scripts]
wordink = "wordink.cli:main"
wordink-mcp = "wordink.mcp_server:main"
wordink-dictd = "wordink.desktop.cli:main"

[project.gui-scripts]
wordink-dictd-tray = "wordink.desktop.win.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordink"]

[tool.uv]
package = true
