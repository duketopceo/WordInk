[project]
name = "groq-flow"
version = "0.1.0"
description = "AI-powered speech-to-text with auto-editing - A Wispr Flow alternative using Groq API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.11.0",
    "pyaudio>=0.2.14",
    "pystray>=0.19.5",
    "pillow>=10.4.0",
    "keyboard>=0.13.5",
    "pyperclip>=1.9.0",
    "pyautogui>=0.9.54",
    "webrtcvad>=2.0.10",
    "numpy>=1.26.4",
    "python-dotenv>=1.0.1",
    "setuptools>=68.0.0,<81.0.0",
]

[project.scripts]
groq-flow = "groq_flow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
