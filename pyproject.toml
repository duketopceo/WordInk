[project]
name = "wordink"
version = "0.2.0"
description = "WordInk — Sub-second voice dictation, SDK, and Grounded GUI voice driver powered by Groq Whisper Turbo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Duketop CEO", email = "duketopceo@users.noreply.github.com" },
    { name = "Parth Jain" }
]
dependencies = [
    "groq>=0.11.0",
    "pyaudio>=0.2.14",
    "pystray>=0.19.5",
    "pillow>=10.4.0",
    "keyboard>=0.13.5",
    "pyperclip>=1.9.0",
    "pyautogui>=0.9.54",
    "webrtcvad>=2.0.10",
    "numpy>=1.26.4",
    "python-dotenv>=1.0.1",
    "setuptools>=68.0.0,<81.0.0",
    "noisereduce>=3.0.0",
    "scipy>=1.11.0",
]

[project.scripts]
wordink = "wordink.main:main"
wordink-onboard = "wordink.onboarding.server:start_onboarding_server"
groq-flow = "wordink.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
